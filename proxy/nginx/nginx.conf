events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Docker internal DNS resolver so dynamic upstreams don't crash nginx startup if not running
    resolver 127.0.0.11 valid=30s ipv6=off;
    
    # This is the default block that handles requests not matching any server_name.
    # It's a good security practice to silently drop unwanted traffic.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
    
        return 444;
    }
    
    # This is the main server block for all HTTP traffic.
    # It handles the Certbot challenge and redirects to HTTPS.
    server {
        listen      80;
        server_name codeeve.com scout.codeeve.com piker.codeeve.com flxng.codeeve.com emo.codeeve.com video.codeeve.com;
    
        # This location is crucial for Certbot's domain validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    
        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
    
    # Domains
    server {
        listen 443 ssl;
        server_name codeeve.com;
    
        ssl_certificate /etc/letsencrypt/live/codeeve.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/codeeve.com/privkey.pem;
        #include /etc/letsencrypt/options-ssl-nginx.conf;
        #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
        root /var/www/codeeve/html;
        index index.html;
    
        location / {
            try_files $uri $uri/ =404;
        }
    
        # Optional: serve gzipped/brotli files if present
        location ~* \.(html|css|js|png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }
    }
        
    server {
        listen 443 ssl;
        server_name scout.codeeve.com;
    
        ssl_certificate /etc/letsencrypt/live/scout.codeeve.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/scout.codeeve.com/privkey.pem;
        #include /etc/letsencrypt/options-ssl-nginx.conf;
        #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
        location / {
            set $upstream_scout piker-api:80;
            proxy_pass         http://$upstream_scout; # Use the internal service name and port
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 600s; 
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
        }
    }
    
    
    server {
        listen 443 ssl;
        server_name piker.codeeve.com;

        ssl_certificate /etc/letsencrypt/live/piker.codeeve.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/piker.codeeve.com/privkey.pem;

        location / {
            set $upstream_piker piker-web:80;
            proxy_pass         http://$upstream_piker;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name emo.codeeve.com;

        ssl_certificate /etc/letsencrypt/live/emo.codeeve.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/emo.codeeve.com/privkey.pem;

        location / {
            set $upstream_emo emo-api:3001;
            proxy_pass         http://$upstream_emo;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name flxng.codeeve.com;
    
        ssl_certificate /etc/letsencrypt/live/flxng.codeeve.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/flxng.codeeve.com/privkey.pem;
        #include /etc/letsencrypt/options-ssl-nginx.conf;
        #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
        location / {
          proxy_pass         http://flxng-app:80; # Reverse-proxy to the flxng-app container
          proxy_set_header   Host $host;
          proxy_set_header   X-Real-IP $remote_addr;
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name video.codeeve.com;

        # Note: Run certbot for video.codeeve.com once DNS is mapped; using codeeve.com wildcard/cert in the interim if available
        ssl_certificate /etc/letsencrypt/live/codeeve.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/codeeve.com/privkey.pem;

        location / {
          proxy_pass         http://video-downloader-app:3000;
          proxy_set_header   Host $host;
          proxy_set_header   X-Real-IP $remote_addr;
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;

          # Extended timeouts to accommodate longer video downloads and streams
          proxy_connect_timeout 600s;
          proxy_send_timeout    600s;
          proxy_read_timeout    600s;
        }
    }
}
